language: php
php:
  - '8.2.35'
  - '8.3.36'
  - '8.4.27'
  - '8.5.12'
env:
  global:
    - XDEBUG_MODE=coverage
before_install:
  - php -r 'if (PHP_VERSION !== getenv("TRAVIS_PHP_VERSION")) { fwrite(STDERR, "Requested PHP runtime unavailable\n"); exit(1); }'
  - php scripts/verify-runtime.php
install:
  - composer install --no-interaction --prefer-dist
  - composer check-platform-reqs
  - composer check-platform-reqs --no-dev
  - composer audit --locked
before_script:
  - sh ./build/ci/createEnvFile.sh
  - sh ./build/ci/createSqliteFile.sh
  - php artisan migrate --force
  - mkdir -p build/logs
script:
  - vendor/bin/phpunit
  - vendor/bin/behat
after_script:
  - vendor/bin/php-coveralls -v
  - wget https://scrutinizer-ci.com/ocular.phar
  - php ocular.phar code-coverage:upload --format=php-clover build/logs/clover.xml
